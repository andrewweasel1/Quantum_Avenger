name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: new_pipeline/requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r new_pipeline/requirements.txt -r new_pipeline/requirements-dev.txt -r new_pipeline/requirements-api.txt
      - name: Lint (ruff)
        run: ruff check new_pipeline
      - name: Tests + coverage gate (>=85%)
        env:
          PYTHONPATH: ${{ github.workspace }}
          NUMBA_DISABLE_JIT: "1"  # let coverage trace the @njit kernels
        run: >-
          pytest new_pipeline/tests
          --cov=new_pipeline --cov-report=term-missing --cov-fail-under=85

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck + build (tsc + vite)
        run: npm run build

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pip-audit (known-vulnerability scan)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r new_pipeline/requirements.txt -r new_pipeline/requirements-api.txt -r new_pipeline/requirements-dev.txt

  images:
    # Gate the Dockerfiles: build (no push) every image from the repo root.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build api image (SPA build + engine runtime)
        run: docker build -f new_pipeline/hardening/docker/Dockerfile.api -t quantum-avenger-api .
      - name: Build app image
        run: docker build -f new_pipeline/hardening/docker/Dockerfile.app -t quantum-avenger-app .
      - name: Build mcp image
        run: docker build -f new_pipeline/hardening/docker/Dockerfile.mcp -t quantum-avenger-mcp .
      - name: Smoke the api container (health endpoint through the image entrypoint)
        run: |
          docker run -d --name qa-api -p 8000:8000 quantum-avenger-api
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/health && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/api/health
          curl -sf http://127.0.0.1:8000/ | grep -q "Quantum Avenger"  # SPA served
          docker logs qa-api
          docker rm -f qa-api
