name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: new_pipeline/requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r new_pipeline/requirements.txt -r new_pipeline/requirements-dev.txt -r new_pipeline/requirements-api.txt
      - name: Lint (ruff)
        run: ruff check new_pipeline
      - name: Tests + coverage gate (>=85%)
        env:
          PYTHONPATH: ${{ github.workspace }}
          NUMBA_DISABLE_JIT: "1"  # let coverage trace the @njit kernels
        run: >-
          pytest new_pipeline/tests
          --cov=new_pipeline --cov-report=term-missing --cov-fail-under=85

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck + build (tsc + vite)
        run: npm run build

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pip-audit (known-vulnerability scan)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r new_pipeline/requirements.txt -r new_pipeline/requirements-api.txt -r new_pipeline/requirements-dev.txt
