# Local prod-like stack. Run from this directory: docker compose up --build
# (build context is the repo root so the images can COPY new_pipeline/).
services:
  app:
    build:
      context: ../../..
      dockerfile: new_pipeline/hardening/docker/Dockerfile.app
    image: quantum-avenger-app
    environment:
      QA_ENV: production
    command: ["health"]

  # NOTE: the web dashboard (React SPA + FastAPI — see /frontend and
  # new_pipeline/api/) is not containerized yet; its image + service land with
  # the deployment phase. The old Streamlit dashboard container was removed.

  mcp:
    build:
      context: ../../..
      dockerfile: new_pipeline/hardening/docker/Dockerfile.mcp
    image: quantum-avenger-mcp
    environment:
      QA_ENV: production
