global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alert_rules.yml

scrape_configs:
  # The FastAPI dashboard server exposes /metrics (process counters + ledger
  # KPI gauges rendered by monitoring.telemetry). If dashboard.auth_enabled is
  # on, give the scraper the bearer token:
  #   authorization: {type: Bearer, credentials: <QA_API_TOKEN>}
  - job_name: quantum-avenger-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
