data:
  raw_vault_dir: "./data/raw"
  processed_vault_dir: "./data/processed"
  parquet_blocksize: "128MiB"
  row_group_size: 100000
  validation_mode: "strict"

features:
  cache_enabled: true
  gpu_enabled: false
  batch_size: 1024
  metadata_dir: "./data/metadata"
  slippage_constant: 0.5
  regime_percentile: 0.8
  bps_scaler: 10000.0
  max_slippage_bps: 50.0
  # Triple-barrier target labels (sl_mult mirrors execution.atr_stop_multiplier).
  label_horizon: 5
  label_cost_bps: 10.0
  label_method: "triple_barrier"
  label_pt_mult: 2.0
  label_sl_mult: 2.0
  # Cross-sectional alpha factors (offense roadmap P0). Empty => off. Available:
  # mom_12_1, reversal_21, low_vol, seasonality. e.g. ["reversal_21", "low_vol"].
  factor_set: []
  factor_sector_neutral: true

models:
  prod_models_dir: "./models/prod"
  candidate_models_dir: "./models/candidates"
  model_version: "v0.1"

execution:
  max_risk_per_trade: 0.02
  atr_stop_multiplier: 2.0
  confidence_threshold: 0.65
  max_adv_coverage: 0.25
  ledger_dir: "./data/ledger"
  max_retries: 3
  tif: "day"
  account_capital: 100000.0

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  log_file: "./logs/system.log"
  max_bytes: 10485760
  json_logs: false
  trace_enabled: true

fusion:
  enabled: false
  ollama_endpoint: "http://localhost:11434"
  llm_model_name: "qwen-3"
  sentiment_timeout: 5.0
  semaphore_limit: 20
  verdict_model: "qwen-3"

system:
  run_mode: "backtest"
  dask_enabled: false
  num_workers: 1
  memory_limit: "8GB"

gpu:
  cuda_enabled: false
  device: "cpu"
  fallback_to_cpu: true

tournament:
  n_groups: 6
  test_groups: 2
  purge_days: 5
  embargo_days: 5
  embargo_pct: 0.01
  penalty_fp: 5.0
  penalty_fn: 1.0
  num_boost_round: 100
  cache_host_ratio: 0.75
  tree_method: "hist"
  device: "cpu"
  # Feature selection: "causal" (Granger directional screen + purged-CPCV MDA,
  # default) | "clustered_permutation" (correlational legacy).
  feature_selection_method: "causal"
  causal_alpha: 0.10
  causal_granger_lags: 3
  # Down-weight overlapping (non-IID) triple-barrier labels in training:
  # "uniqueness" (LdP average uniqueness) | "none".
  sample_weighting: "uniqueness"
  # Meta-labeling (P3): secondary act/size model on the fired primary signal (default off).
  enable_meta_labeling: false
  meta_threshold: 0.5
  meta_criterion: "f1"
  sectors:
    - "Information Technology"
    - "Health Care"
    - "Financials"
    - "Consumer Discretionary"
    - "Communication Services"
    - "Industrials"
    - "Consumer Staples"
    - "Energy"
    - "Utilities"
    - "Real Estate"
    - "Materials"

evaluation:
  dsr_promotion_threshold: 0.95
  hmm_states: 3
  hmm_n_iter: 100
  synthetic_sr_min: 0.0
  registry_path: "./models/prod/promotion_registry.json"
  psr_benchmark_sr: 0.0
  pbo_threshold: 0.5
  pbo_partitions: 10
  mt_method: "bhy"
  enforce_minbtl: false
  cpcv_path_gate_enabled: true
  cpcv_path_min_fraction: 0.5
  gauntlet_block_size: 10
  alpha_eval_enabled: true
  alpha_eval_min_names: 5
  reality_check_enabled: false
  reality_check_bootstrap: 500
  reality_check_block: 10

mcp:
  transport: "stdio"

rag:
  embedder: "hashing"
  top_k: 5
  chunk_size: 512
  chunk_overlap: 100

news:
  providers:
    - "gdelt"
  fixture_path: ""  # empty -> packaged new_pipeline/data/news/headlines.csv
  vault_dir: "./data/raw/news"
  limit: 20
  gdelt_endpoint: "https://api.gdeltproject.org/api/v2/doc/doc"
  edgar_forms:
    - "8-K"
    - "10-Q"
    - "10-K"
  edgar_identity: ""

dashboard:
  veto_ledger_path: "./data/ledger/veto_ledger.parquet"
  trade_log_path: "./data/ledger/trade_log.parquet"
  refresh_seconds: 5
  max_drawdown_alert: 0.15
  min_sharpe_alert: 0.0
  max_veto_rate_alert: 0.5

alpaca:
  # Credentials are injected via QA_ALPACA__API_KEY / QA_ALPACA__SECRET_KEY env
  # vars (never committed). Paper trading + the free IEX data feed by default.
  api_key: ""
  secret_key: ""
  paper: true
  data_feed: "iex"
