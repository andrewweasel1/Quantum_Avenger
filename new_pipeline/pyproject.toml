[project]
name = "quantum_avenger"
version = "0.1.0"
description = "Phase 1 core pipeline infrastructure for Quantum Avenger."
readme = "README.md"
requires-python = ">=3.11"

[project.dependencies]
pydantic = "^2.0"
pytest = "^8.0"
pyyaml = "^6.0"
numpy = "^1.25"

[project.urls]
homepage = "https://github.com/andrewweasel1/Quantum_Avenger"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = [
    # ValidationMode / RunMode intentionally subclass (str, Enum) for stable
    # JSON/YAML serialization; StrEnum would change str() output semantics.
    "UP042",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom calls Depends()/Query()/etc. in argument
# defaults by design; treat them as immutable so B008 doesn't flag every route.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.coverage.run]
source = ["new_pipeline"]
branch = true
omit = [
    # Live integrations: require alpaca-py + egress, absent from the offline CI
    # image, so they are exercised by mock-injected unit tests here but excluded
    # from the coverage gate (cf. the @pytest.mark.gpu kernels).
    "new_pipeline/adapters/market_alpaca.py",
    "new_pipeline/adapters/news_alpaca.py",
    "new_pipeline/adapters/broker_alpaca.py",
    "new_pipeline/scripts/live_smoke.py",
    "new_pipeline/scripts/ingest_training_data.py",
    # Fusion ML adapters: require torch/transformers/spaCy/sentence-transformers,
    # absent from the CI image.
    "new_pipeline/adapters/sentiment_finbert.py",
    "new_pipeline/execution/anonymizer_spacy.py",
    "new_pipeline/execution/embedders.py",
    # Live PIT news providers: require egress (GDELT) / edgartools (EDGAR).
    "new_pipeline/adapters/news_gdelt.py",
    "new_pipeline/adapters/news_edgar.py",
]

[tool.coverage.report]
show_missing = true
# A hard ">= 85%" gate is enforced in CI during Phase 7; left unset here so the
# suite stays green while later-phase modules are still being built.
